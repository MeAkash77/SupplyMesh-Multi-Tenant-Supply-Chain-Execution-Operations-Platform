apiVersion: v1
kind: Namespace
metadata: { name: supplymesh }
---
apiVersion: v1
kind: ConfigMap
metadata: { name: supplymesh-config, namespace: supplymesh }
data:
  Kafka__BootstrapServers: "supplymesh-ns.servicebus.windows.net:9093"   # Azure Event Hubs Kafka endpoint
  Statsd__Host: "telegraf.monitoring.svc"
  Elastic__Url: "http://elasticsearch.monitoring.svc:9200"
  Auth__Authority: "https://login.microsoftonline.com/<tenant-id>/v2.0"
  Auth__Audience: "api://supplymesh"
---
# Secrets are synced from Azure Key Vault via the CSI driver (see deploy/azure/main.bicep); placeholder shown for shape only
apiVersion: v1
kind: Secret
metadata: { name: supplymesh-secrets, namespace: supplymesh }
stringData: { ConnectionStrings__Sql: "REPLACE_FROM_KEYVAULT", Kafka__EventHubsConnectionString: "REPLACE_FROM_KEYVAULT" }
