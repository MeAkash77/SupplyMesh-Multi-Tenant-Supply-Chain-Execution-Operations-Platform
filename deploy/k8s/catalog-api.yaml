apiVersion: apps/v1
kind: Deployment
metadata: { name: catalog-api, namespace: supplymesh, labels: { app: catalog-api } }
spec:
  replicas: 3
  strategy: { rollingUpdate: { maxUnavailable: 0, maxSurge: 1 } }
  selector: { matchLabels: { app: catalog-api } }
  template:
    metadata: { labels: { app: catalog-api } }
    spec:
      securityContext: { runAsNonRoot: true, seccompProfile: { type: RuntimeDefault } }
      topologySpreadConstraints: [{ maxSkew: 1, topologyKey: topology.kubernetes.io/zone, whenUnsatisfiable: ScheduleAnyway, labelSelector: { matchLabels: { app: catalog-api } } }]
      containers:
        - name: catalog-api
          image: supplymeshacr.azurecr.io/supplymesh/catalog-api:latest
          ports: [{ containerPort: 8080 }]
          envFrom: [{ configMapRef: { name: supplymesh-config } }, { secretRef: { name: supplymesh-secrets } }]
          resources: { requests: { cpu: 200m, memory: 256Mi }, limits: { cpu: "1", memory: 512Mi } }
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
          startupProbe: { httpGet: { path: /health/live, port: 8080 }, failureThreshold: 30, periodSeconds: 2 }
          livenessProbe: { httpGet: { path: /health/live, port: 8080 }, periodSeconds: 10 }
          readinessProbe: { httpGet: { path: /health/ready, port: 8080 }, periodSeconds: 5 }
---
apiVersion: v1
kind: Service
metadata: { name: catalog-api, namespace: supplymesh }
spec: { selector: { app: catalog-api }, ports: [{ port: 80, targetPort: 8080 }] }
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: { name: catalog-api, namespace: supplymesh }
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: catalog-api }
  minReplicas: 3
  maxReplicas: 12
  metrics: [{ type: Resource, resource: { name: cpu, target: { type: Utilization, averageUtilization: 65 } } }]
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: { name: catalog-api, namespace: supplymesh }
spec: { minAvailable: 2, selector: { matchLabels: { app: catalog-api } } }
