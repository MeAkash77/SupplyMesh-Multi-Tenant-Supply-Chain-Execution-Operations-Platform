# App metrics (StatsD UDP from services) + host metrics (CPU/mem/disk/net) -> InfluxDB 2 -> Grafana
[agent]
  interval = "10s"
[[inputs.statsd]]
  service_address = ":8125"
  delete_gauges = true
  delete_counters = true
  datadog_extensions = true      # supports |#tag:value
[[inputs.cpu]]
[[inputs.mem]]
[[inputs.disk]]
[[inputs.net]]
[[inputs.sqlserver]]             # MSSQL waits, perf counters, memory clerks
  servers = ["Server=mssql;User Id=sa;Password=Your_strong_pw1;TrustServerCertificate=true;"]
  query_version = 2
[[inputs.kafka_consumer]]
  brokers = ["kafka:9092"]
  topics = ["po.events"]
  data_format = "json"
  json_string_fields = ["type","status"]
  tag_keys = ["tenantId"]
[[outputs.influxdb_v2]]
  urls = ["http://influxdb:8086"]
  token = "dev-token"
  organization = "supplymesh"
  bucket = "metrics"
